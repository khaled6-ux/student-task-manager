name: V1 checks

on:
  push:
    branches: [develop, main, 'feat/**', 'fix/**']
  pull_request:
    branches: [develop, main]

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx tsc -b --noEmit
      - run: npm run build
        env:
          VITE_API_URL: https://api.example.test
          VITE_SUPABASE_URL: https://project.example.test
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_CI_PLACEHOLDER
          VITE_DEMO_MODE: 'false'
      - run: npm audit --omit=dev --audit-level=high
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: student
          POSTGRES_DB: student_tasks_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U student -d student_tasks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      REQUIRE_TEST_DATABASE: 'true'
      TEST_DATABASE_URL: postgresql+psycopg://student@127.0.0.1:5432/student_tasks_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check .
      - run: python -m pytest
      - run: python -m alembic heads
      - name: Audit resolved Python dependencies
        run: |
          python -m pip list --format freeze > /tmp/student-backend-audit.txt
          python -m pip install pip-audit==2.10.1
          pip-audit --disable-pip --no-deps -r /tmp/student-backend-audit.txt
